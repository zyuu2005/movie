# Render 云端一键配置：单实例 Node 服务 + 持久 SQLite 磁盘。
services:
  - type: web
    name: movie-night-yuqi
    runtime: node
    region: singapore
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: movie-night-data
      mountPath: /var/lib/movie-night
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/lib/movie-night/movie-night.db
